<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>カタン投影ボード</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bitter:wght@800&family=Dela+Gothic+One&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap">
<style>
/* 投影専用の1画面。盤面が中央、色パレットが左、四隅に位置合わせの目印。 */
:root{
  color-scheme:dark;
  --sea:#0a2030; --sea-2:#123a52; --panel:#0e2a3e; --line:#27495e;
  --ink:#ecf3f1; --muted:#9fb7c1; --accent:#f4b63f; --accent-ink:#2a1c05;
  --shore:#ead9ae; --pier:#b08a55;
  --token:#f7edd3; --token-ink:#2b2219; --token-hot:#c5301c; --robber:#4a4038;
  --bad:#ff5a4e; --ok:#7ee0a0;
  --t-forest:#2f7f50; --t-forest-2:#1f6039; --t-hills:#c4622f; --t-hills-2:#9a4519;
  --t-pasture:#9ed05a; --t-pasture-2:#7db23d; --t-fields:#f1c644; --t-fields-2:#d8a41f;
  --t-mountains:#8d97a8; --t-mountains-2:#6a7487; --t-desert:#e6d3a0; --t-desert-2:#cdb777;
  --font-display:"Dela Gothic One","Hiragino Kaku Gothic ProN","Yu Gothic",Meiryo,sans-serif;
  --font-body:"Zen Kaku Gothic New","Hiragino Kaku Gothic ProN","Yu Gothic",Meiryo,sans-serif;
  --font-num:"Bitter",Georgia,serif;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0;overflow:hidden}
body{background:radial-gradient(closest-side,var(--sea-2),var(--sea)) var(--sea);color:var(--ink);font-family:var(--font-body);font-size:15px;line-height:1.5;touch-action:none;user-select:none;-webkit-user-select:none}
svg#board{position:absolute;inset:0;width:100%;height:100%;display:block}
.hex{stroke:var(--shore);stroke-width:7;stroke-linejoin:round}
.hex.photo{fill:none;stroke:var(--sea);stroke-width:6}
.lbl{font-family:var(--font-display);font-size:30px;text-anchor:middle;dominant-baseline:central;fill:var(--token-ink);stroke:var(--token);stroke-width:7;stroke-linejoin:round;paint-order:stroke}
.tok circle{fill:var(--token-ink)} .tok .disc{fill:var(--token);stroke:var(--token-ink);stroke-opacity:.3;stroke-width:2}
.num{font-family:var(--font-num);font-weight:800;font-size:42px;text-anchor:middle;dominant-baseline:central;fill:var(--token-ink)}
.hot .num{fill:var(--token-hot)} .hot circle{fill:var(--token-hot)} .tok.hot .disc{fill:var(--token)}
.robber{fill:var(--robber);stroke:var(--token);stroke-width:2.5}
.pier{stroke:var(--pier);stroke-width:8;stroke-linecap:round}
.port .ring{fill:var(--token);stroke-width:9}
.port .pk{font-family:var(--font-display);font-size:25px;text-anchor:middle;dominant-baseline:central;fill:var(--token-ink)}
.port .pr{font-family:var(--font-num);font-weight:800;font-size:18px;text-anchor:middle;dominant-baseline:central;fill:var(--token-ink)}
.port .pr.big{font-size:26px}
.b-forest{fill:var(--t-forest)} .k-forest{fill:var(--t-forest-2)}
.b-hills{fill:var(--t-hills)} .k-hills{stroke:var(--t-hills-2);stroke-width:2;fill:none}
.b-pasture{fill:var(--t-pasture)} .k-pasture{fill:var(--t-pasture-2)}
.b-fields{fill:var(--t-fields)} .k-fields{stroke:var(--t-fields-2);stroke-width:3;fill:none}
.b-mountains{fill:var(--t-mountains)} .k-mountains{stroke:var(--t-mountains-2);stroke-width:2.5;fill:none}
.b-desert{fill:var(--t-desert)} .k-desert{fill:var(--t-desert-2)}
.r-any{stroke:var(--pier)} .r-forest{stroke:var(--t-forest)} .r-hills{stroke:var(--t-hills)}
.r-pasture{stroke:var(--t-pasture-2)} .r-fields{stroke:var(--t-fields-2)} .r-mountains{stroke:var(--t-mountains)}

/* 駒 */
.piece{stroke:#1b1510;stroke-width:3;stroke-linejoin:round}
.piece.ghost{opacity:.85;filter:drop-shadow(0 6px 6px rgba(0,0,0,.5))}
.vdot{fill:var(--token);opacity:0}
.vdot.show{opacity:.35}
.target{fill:none;stroke:var(--ok);stroke-width:5;stroke-dasharray:10 8}
.target.bad{stroke:var(--bad)}
.cursor{fill:none;stroke-width:4}
.cursor.grab{fill-opacity:.35}
/* パレット */
.sw{stroke:#1b1510;stroke-width:3}
.sw-ring{fill:none;stroke:var(--token);stroke-width:5;opacity:0}
.sw-ring.on{opacity:1}
.sw-cnt{font-family:var(--font-num);font-weight:800;font-size:24px;fill:var(--token);text-anchor:middle;dominant-baseline:central}
.sw-lbl{font-family:var(--font-body);font-weight:700;font-size:20px;fill:var(--muted);text-anchor:middle}

/* 位置合わせの目印 */
.mark{position:fixed;width:56px;height:56px;transform:translate(-50%,-50%);pointer-events:none}
.mark::before,.mark::after{content:"";position:absolute;inset:0;border-radius:50%;border:5px solid #fff;box-shadow:0 0 0 4px #000}
.mark::after{inset:20px;background:#fff;border:0;box-shadow:0 0 0 4px #000}
#m1{left:4%;top:4%} #m2{left:96%;top:4%} #m3{left:96%;top:96%} #m4{left:4%;top:96%}
body.nomarks .mark{display:none}

/* 上部の情報 */
.hud{position:fixed;top:calc(4% + 40px);right:2.5%;display:flex;flex-direction:column;gap:8px;align-items:flex-end;pointer-events:none}
.code{font-family:var(--font-num);font-weight:800;font-size:34px;letter-spacing:.18em;color:var(--token);background:rgba(0,0,0,.35);padding:4px 14px 4px 18px;border-radius:10px}
.code small{font:700 13px/1 var(--font-body);letter-spacing:.1em;color:var(--muted);display:block;margin-bottom:2px}
.status{font-weight:700;font-size:13px;color:var(--muted);background:rgba(0,0,0,.35);padding:6px 10px;border-radius:10px;display:flex;align-items:center;gap:8px}
.status i{width:10px;height:10px;border-radius:50%;background:var(--bad);display:inline-block}
.status.on i{background:var(--ok)}
.msg{position:fixed;left:50%;bottom:calc(4% + 40px);transform:translateX(-50%);background:rgba(0,0,0,.5);color:var(--token);font-weight:700;padding:8px 16px;border-radius:10px;opacity:0;transition:opacity .25s;pointer-events:none;max-width:90vw;text-align:center}
.msg.show{opacity:1}

/* ツールバー（触らないと薄くなる） */
.bar{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 4px);transform:translateX(-50%);display:flex;gap:6px;flex-wrap:wrap;justify-content:center;padding:6px;transition:opacity .3s;opacity:.9;max-width:100vw}
body.idle .bar{opacity:0}
.bar:focus-within,.bar:hover{opacity:1!important}
.btn{font:700 13px/1.2 var(--font-body);color:var(--ink);background:var(--panel);border:1.5px solid var(--line);border-radius:8px;padding:8px 10px;cursor:pointer}
.btn:hover{border-color:var(--ink)} .btn:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
dialog{background:var(--panel);color:var(--ink);border:1px solid var(--line);border-radius:12px;padding:20px;max-width:min(92vw,420px);font-family:var(--font-body)}
dialog::backdrop{background:rgba(0,0,0,.5)}
dialog h2{margin:0 0 10px;font-size:17px}
dialog label{display:block;font-size:13px;color:var(--muted);margin:10px 0 4px}
dialog input{width:100%;font:inherit;padding:8px 10px;border-radius:8px;border:1.5px solid var(--line);background:var(--sea);color:var(--ink)}
dialog .row{display:flex;gap:8px;justify-content:flex-end;margin-top:14px}
dialog p{font-size:13px;color:var(--muted);margin:6px 0 0}
</style>
</head>
<body>

<svg id="board" viewBox="-700 -485 1400 970" role="img" aria-label="カタンの盤面と駒">
  <defs>
    <clipPath id="hexclip"><polygon id="hexclip-poly"/></clipPath>
    <pattern id="p-forest" width="30" height="30" patternUnits="userSpaceOnUse"><rect width="30" height="30" class="b-forest"/><path d="M8 22l7-13 7 13z" class="k-forest"/></pattern>
    <pattern id="p-hills" width="36" height="24" patternUnits="userSpaceOnUse"><rect width="36" height="24" class="b-hills"/><path d="M0 1h36M0 13h36M9 1v12M27 13v11" class="k-hills"/></pattern>
    <pattern id="p-pasture" width="24" height="24" patternUnits="userSpaceOnUse"><rect width="24" height="24" class="b-pasture"/><circle cx="6" cy="6" r="2.6" class="k-pasture"/><circle cx="18" cy="18" r="2.6" class="k-pasture"/></pattern>
    <pattern id="p-fields" width="16" height="16" patternUnits="userSpaceOnUse" patternTransform="rotate(35)"><rect width="16" height="16" class="b-fields"/><path d="M0 8h16" class="k-fields"/></pattern>
    <pattern id="p-mountains" width="36" height="22" patternUnits="userSpaceOnUse"><rect width="36" height="22" class="b-mountains"/><path d="M0 18l9-12 9 12 9-12 9 12" class="k-mountains"/></pattern>
    <pattern id="p-desert" width="26" height="26" patternUnits="userSpaceOnUse"><rect width="26" height="26" class="b-desert"/><circle cx="5" cy="7" r="1.8" class="k-desert"/><circle cx="18" cy="19" r="1.8" class="k-desert"/></pattern>
    <g id="photos"></g>
    <!-- 開拓地と都市の形 -->
    <path id="shape-settlement" d="M-20 18v-20l20-18 20 18v20z"/>
    <path id="shape-city" d="M-30 22v-22l16-15 16 15v-18h12v18l16 0v22z"/>
  </defs>
  <g id="ports"></g>
  <g id="tiles"></g>
  <g id="vdots"></g>
  <g id="palette"></g>
  <g id="pieces"></g>
  <g id="overlay"></g>
</svg>

<div class="mark" id="m1"></div><div class="mark" id="m2"></div><div class="mark" id="m3"></div><div class="mark" id="m4"></div>

<div class="hud">
  <div class="code"><small>ルームコード</small><span id="code">----</span></div>
  <div class="status" id="relay"><i></i><span>中継サーバー未接続</span></div>
  <div class="status" id="cam"><i></i><span>カメラ未接続</span></div>
</div>
<div class="msg" id="msg"></div>

<div class="bar" id="bar">
  <button class="btn primary" id="b-new" type="button">新しい盤面</button>
  <button class="btn" id="b-mode" type="button">5〜6人用に切替</button>
  <button class="btn" id="b-last" type="button">盤面メーカーの最後の盤面</button>
  <button class="btn" id="b-clear" type="button">駒を全部外す</button>
  <button class="btn" id="b-marks" type="button">目印を隠す</button>
  <button class="btn" id="b-full" type="button">全画面</button>
  <button class="btn" id="b-set" type="button">設定</button>
</div>

<dialog id="dlg">
  <h2>設定</h2>
  <label for="in-relay">中継サーバー（wss://…）</label>
  <input id="in-relay" type="url" placeholder="wss://catan-relay.xxxx.workers.dev">
  <label for="in-code">ルームコード（英数字4〜8文字）</label>
  <input id="in-code" type="text" maxlength="8" autocapitalize="characters" spellcheck="false">
  <p>カメラ用スマホの cam.html でも同じサーバーとコードを入れます。</p>
  <div class="row">
    <button class="btn" id="dlg-cancel" type="button">閉じる</button>
    <button class="btn primary" id="dlg-ok" type="button">保存して接続</button>
  </div>
</dialog>

<script src="config.js"></script>
<script src="assets/tile-photos.js"></script>
<script>
(function(){
  'use strict';
  var R=100, W=R*Math.sqrt(3), KEY='catan-play-v1', GEN_KEY='catan-board-v2';
  var $=function(id){return document.getElementById(id);};
  var T={forest:{short:'木'},hills:{short:'土'},pasture:{short:'羊'},fields:{short:'麦'},mountains:{short:'鉄'},desert:{short:''}};
  var COLORS=[
    {name:'赤',fill:'#d7382b'},{name:'青',fill:'#2f6fd1'},{name:'白',fill:'#f3efe4'},{name:'橙',fill:'#f08a24'},
    {name:'緑',fill:'#3f9a4d'},{name:'茶',fill:'#8a5a2b'}
  ];
  function expand(c){var a=[];Object.keys(c).forEach(function(k){for(var i=0;i<c[k];i++)a.push(isNaN(+k)?k:+k);});return a;}
  var MODES={
    std:{rows:[3,4,5,4,3],terrain:{forest:4,hills:3,pasture:4,fields:4,mountains:3,desert:1},
      nums:{2:1,3:2,4:2,5:2,6:2,8:2,9:2,10:2,11:2,12:1},ports:{any:4,forest:1,hills:1,pasture:1,fields:1,mountains:1},
      slots:[[0,0,4],[0,1,5],[1,3,5],[2,4,0],[3,3,1],[4,2,1],[4,1,2],[3,0,3],[1,0,3]],players:4},
    six:{rows:[3,4,5,6,5,4,3],terrain:{forest:6,hills:5,pasture:6,fields:6,mountains:5,desert:2},
      nums:{2:2,3:3,4:3,5:3,6:3,8:3,9:3,10:3,11:3,12:2},ports:{any:5,forest:1,hills:1,pasture:2,fields:1,mountains:1},slots:null,players:6}
  };

  // ---------- 盤面の幾何 ----------
  Object.keys(MODES).forEach(function(m){
    var M=MODES[m], nr=M.rows.length, hexes=[], at={};
    M.rows.forEach(function(L,ri){for(var p=0;p<L;p++){at[ri+','+p]=hexes.length;hexes.push({x:W*(p-(L-1)/2),y:1.5*R*(ri-(nr-1)/2)});}});
    function find(x,y){for(var i=0;i<hexes.length;i++)if(Math.abs(hexes[i].x-x)<1&&Math.abs(hexes[i].y-y)<1)return i;return -1;}
    var nbr=hexes.map(function(){return [];}), outer=[];
    hexes.forEach(function(h,i){for(var k=0;k<6;k++){var a=k*Math.PI/3,j=find(h.x+W*Math.cos(a),h.y+W*Math.sin(a));
      if(j>=0)nbr[i].push(j);else outer.push({i:i,k:k,ang:Math.atan2(h.y+0.87*R*Math.sin(a),h.x+0.87*R*Math.cos(a))});}});
    // 頂点（開拓地を置ける場所）
    var verts=[], vkey={};
    hexes.forEach(function(h){for(var k=0;k<6;k++){var a=(60*k-90)*Math.PI/180,x=h.x+R*Math.cos(a),y=h.y+R*Math.sin(a),key=Math.round(x)+','+Math.round(y);
      if(vkey[key]===undefined){vkey[key]=verts.length;verts.push({x:x,y:y,adj:[]});}}});
    verts.forEach(function(v,i){verts.forEach(function(u,j){if(i!==j&&Math.abs(Math.hypot(v.x-u.x,v.y-u.y)-R)<2)v.adj.push(j);});});
    M.hexes=hexes;M.nbr=nbr;M.n=hexes.length;M.verts=verts;
    if(M.slots)M.portAt=M.slots.map(function(s){return [at[s[0]+','+s[1]],s[2]];});
    else{outer.sort(function(a,b){return a.ang-b.ang;});var np=expand(M.ports).length,E=outer.length;M.portAt=[];
      for(var q=0;q<np;q++){var e=outer[Math.floor(q*E/np+1)%E];M.portAt.push([e.i,e.k]);}}
    var x0=1e9,x1=-1e9,y0=1e9,y1=-1e9;hexes.forEach(function(h){x0=Math.min(x0,h.x);x1=Math.max(x1,h.x);y0=Math.min(y0,h.y);y1=Math.max(y1,h.y);});
    M.bounds={x0:x0,x1:x1,y0:y0,y1:y1};
  });
  var HEXPTS=[0,1,2,3,4,5].map(function(k){var a=(60*k-90)*Math.PI/180;return (R*Math.cos(a)).toFixed(1)+','+(R*Math.sin(a)).toFixed(1);}).join(' ');
  $('hexclip-poly').setAttribute('points',[0,1,2,3,4,5].map(function(k){var a=(60*k-90)*Math.PI/180;return (97*Math.cos(a)).toFixed(1)+','+(97*Math.sin(a)).toFixed(1);}).join(' '));
  if(window.TILE_PHOTOS){var ph='';Object.keys(TILE_PHOTOS).forEach(function(k){ph+='<image id="ph-'+k+'" x="-86.6" y="-100" width="173.2" height="200" preserveAspectRatio="none" href="'+TILE_PHOTOS[k]+'"/>';});$('photos').innerHTML=ph;}

  function shuffle(a){for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t;}return a;}
  function pipsOf(n){return 6-Math.abs(7-n);}
  function place(M,slots,bag,conflict){
    var out={},budget=300000;
    function go(d,rest){
      if(d===slots.length)return true;if(--budget<0)return false;
      var s=slots[d],seen={},order=shuffle(rest.slice());
      for(var x=0;x<order.length;x++){var v=order[x];if(seen[v])continue;seen[v]=1;
        if(M.nbr[s].some(function(j){return out[j]!==undefined&&conflict(v,out[j]);}))continue;
        out[s]=v;var r2=rest.slice();r2.splice(r2.indexOf(v),1);if(go(d+1,r2))return true;delete out[s];}
      return false;}
    if(!go(0,bag)){out={};var b=shuffle(bag.slice());slots.forEach(function(s,i){out[s]=b[i];});}
    return out;
  }
  function generate(mode){
    var M=MODES[mode],all=[];for(var i=0;i<M.n;i++)all.push(i);
    var tt=place(M,all,expand(M.terrain),function(){return false;});
    var terrain=all.map(function(i){return tt[i];});
    var land=all.filter(function(i){return terrain[i]!=='desert';});
    var nn=place(M,land,expand(M.nums),function(a,b){return (a===6||a===8)&&(b===6||b===8);});
    return {mode:mode,terrain:terrain,numbers:all.map(function(i){return nn[i]||0;}),ports:shuffle(expand(M.ports))};
  }

  // ---------- 状態 ----------
  var S={board:null,pieces:[],color:0,showMarks:true,relay:'',code:''};
  function save(){try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){}}
  function load(){
    try{var d=JSON.parse(localStorage.getItem(KEY)||'null');if(d){Object.keys(S).forEach(function(k){if(d[k]!==undefined)S[k]=d[k];});}}catch(e){}
    if(!S.board||!MODES[S.board.mode])S.board=generate('std');
    if(!S.relay)S.relay=window.CATAN_RELAY||'';
    if(!/^[A-Z0-9]{4,8}$/.test(S.code))S.code=randomCode();
  }
  function randomCode(){var s='',c='ABCDEFGHJKMNPQRSTUVWXYZ23456789';for(var i=0;i<4;i++)s+=c[Math.floor(Math.random()*c.length)];return s;}
  function lastGenerated(){
    try{var d=JSON.parse(localStorage.getItem(GEN_KEY)||'null');var b=d&&d.stack&&d.stack[d.stack.length-1];if(b&&MODES[b.mode])return b;}catch(e){}
    return null;
  }

  // ---------- 描画 ----------
  var svg=$('board'), PAL_X=0;
  function M(){return MODES[S.board.mode];}
  function renderBoard(){
    var b=S.board,m=M(),html='',robber=false,photo=!!window.TILE_PHOTOS;
    m.hexes.forEach(function(h,i){
      var k=b.terrain[i],n=b.numbers[i];
      var inner=photo?'<g clip-path="url(#hexclip)"><use href="#ph-'+k+'" transform="rotate('+(((i*5+k.length)%6)*60)+')"/></g><polygon class="hex photo" points="'+HEXPTS+'"/>'
                     :'<polygon class="hex" points="'+HEXPTS+'" fill="url(#p-'+k+')"/>';
      if(k==='desert'){if(!photo)inner+='<text class="lbl" y="'+(robber?-6:-46)+'">砂漠</text>';
        if(!robber){inner+='<g class="robber"><circle cy="0" r="11"/><path d="M-17 44q0-34 17-34 17 0 17 34z"/></g>';robber=true;}}
      else{var p=pipsOf(n),dots='';for(var j=0;j<p;j++)dots+='<circle cx="'+((j-(p-1)/2)*9)+'" cy="37" r="3.1"/>';
        inner+=(photo?'':'<text class="lbl" y="-52">'+T[k].short+'</text>')+'<g class="tok'+(p===5?' hot':'')+'"><circle class="disc" cy="14" r="38"/><text class="num" y="7">'+n+'</text>'+dots+'</g>';}
      html+='<g transform="translate('+h.x.toFixed(1)+' '+h.y.toFixed(1)+')">'+inner+'</g>';
    });
    $('tiles').innerHTML=html;
    var ph='';
    m.portAt.forEach(function(s,i){
      var h=m.hexes[s[0]],a=s[1]*60*Math.PI/180,k=b.ports[i],cx=h.x+152*Math.cos(a),cy=h.y+152*Math.sin(a);
      [-1,1].forEach(function(sg){var va=a+sg*Math.PI/6;ph+='<line class="pier" x1="'+cx.toFixed(1)+'" y1="'+cy.toFixed(1)+'" x2="'+(h.x+R*Math.cos(va)).toFixed(1)+'" y2="'+(h.y+R*Math.sin(va)).toFixed(1)+'"/>';});
      ph+='<g class="port" transform="translate('+cx.toFixed(1)+' '+cy.toFixed(1)+')"><circle class="ring r-'+k+'" r="36"/>'+(k==='any'?'<text class="pr big" y="1">3:1</text>':'<text class="pk" y="-8">'+T[k].short+'</text><text class="pr" y="17">2:1</text>')+'</g>';
    });
    $('ports').innerHTML=ph;
    $('vdots').innerHTML=m.verts.map(function(v,i){return '<circle class="vdot" data-v="'+i+'" cx="'+v.x.toFixed(1)+'" cy="'+v.y.toFixed(1)+'" r="9"/>';}).join('');
    var B=m.bounds,pad=200,padY=215;
    PAL_X=B.x0-pad-120;
    svg.setAttribute('viewBox',(PAL_X-90)+' '+(B.y0-padY)+' '+(B.x1-PAL_X+90+pad+150)+' '+(B.y1-B.y0+2*padY));
    $('b-mode').textContent=S.board.mode==='std'?'5〜6人用に切替':'3〜4人用に切替';
    renderPalette();renderPieces();
  }
  function renderPalette(){
    var n=M().players,h='',B=M().bounds,top=(B.y0+B.y1)/2-(n-1)*62;
    for(var i=0;i<n;i++){var y=top+i*124,c=COLORS[i],cnt=count(i);
      h+='<g class="swg" data-c="'+i+'" transform="translate('+PAL_X+' '+y+')"><circle class="sw-ring'+(S.color===i?' on':'')+'" r="52"/>'+
         '<circle class="sw" r="40" fill="'+c.fill+'"/><text class="sw-cnt" y="2" style="fill:'+(i===2?'#222':'#fff')+'">'+(cnt.vp||'')+'</text>'+
         '<text class="sw-lbl" y="74">'+c.name+'</text></g>';}
    $('palette').innerHTML=h;
  }
  function count(c){var s=0,ci=0;S.pieces.forEach(function(p){if(p.c===c){if(p.k==='city')ci++;else s++;}});return {s:s,city:ci,vp:s+2*ci};}
  function pieceSvg(p,x,y,cls){
    return '<use class="piece'+(cls?' '+cls:'')+'" href="#shape-'+p.k+'" x="'+x.toFixed(1)+'" y="'+y.toFixed(1)+'" fill="'+COLORS[p.c].fill+'"/>';
  }
  function renderPieces(){
    var vs=M().verts;
    $('pieces').innerHTML=S.pieces.filter(function(p){return p!==drag.piece;}).map(function(p){return pieceSvg(p,vs[p.v].x,vs[p.v].y);}).join('');
    renderPalette();
  }

  // ---------- 操作 ----------
  var drag={piece:null,from:null,isNew:false,pos:null,start:0};
  var pointerSvg=null, pinched=false;
  function toSvg(cx,cy){var pt=svg.createSVGPoint();pt.x=cx;pt.y=cy;return pt.matrixTransform(svg.getScreenCTM().inverse());}
  function nearestVertex(p){var vs=M().verts,best=-1,bd=1e9;vs.forEach(function(v,i){var d=Math.hypot(v.x-p.x,v.y-p.y);if(d<bd){bd=d;best=i;}});return bd<R*0.75?best:-1;}
  function swatchAt(p){var n=M().players,B=M().bounds,top=(B.y0+B.y1)/2-(n-1)*62;for(var i=0;i<n;i++){if(Math.hypot(p.x-PAL_X,p.y-(top+i*124))<58)return i;}return -1;}
  function pieceAt(v){for(var i=0;i<S.pieces.length;i++)if(S.pieces[i].v===v)return S.pieces[i];return null;}
  function canPlace(v,piece){
    var other=pieceAt(v);if(other&&other!==piece)return false;
    var adj=M().verts[v].adj;for(var i=0;i<adj.length;i++){var q=pieceAt(adj[i]);if(q&&q!==piece)return false;}
    return true;
  }
  function flash(t){var m=$('msg');m.textContent=t;m.classList.add('show');clearTimeout(flash.t);flash.t=setTimeout(function(){m.classList.remove('show');},1600);}

  function onMove(p){
    pointerSvg=p;
    if(drag.piece)drag.pos=p;
    renderOverlay();
  }
  function onGrab(p){
    pointerSvg=p;pinched=true;
    var sw=swatchAt(p);
    if(sw>=0){S.color=sw;save();renderPalette();flash(COLORS[sw].name+'の番');return;}
    var v=nearestVertex(p);if(v<0)return;
    var ex=pieceAt(v);
    if(ex){drag={piece:ex,from:v,isNew:false,pos:p,start:Date.now()};}
    else{var np={k:'settlement',c:S.color,v:-1};drag={piece:np,from:null,isNew:true,pos:p,start:Date.now()};}
    renderPieces();renderOverlay();
  }
  function onRelease(p){
    pinched=false;if(p)pointerSvg=p;
    var d=drag;drag={piece:null,from:null,isNew:false,pos:null,start:0};
    if(!d.piece){renderOverlay();return;}
    var v=nearestVertex(p||d.pos||{x:1e9,y:1e9});
    if(v<0){ // 盤面の外で離した → 外す
      if(!d.isNew){S.pieces=S.pieces.filter(function(q){return q!==d.piece;});flash('駒を外しました');}
    }else if(!d.isNew&&v===d.from){
      if(d.piece.k==='settlement'){d.piece.k='city';flash('都市になりました');}
      else{d.piece.k='settlement';flash('開拓地に戻しました');}
    }else if(canPlace(v,d.piece)){
      d.piece.v=v;if(d.isNew)S.pieces.push(d.piece);
    }else{
      flash('そこには置けません（隣が埋まっています）');
    }
    save();renderPieces();renderOverlay();
  }
  function renderOverlay(){
    var h='',p=pointerSvg;
    document.querySelectorAll('.vdot').forEach(function(e){e.classList.toggle('show',!!drag.piece);});
    if(p){
      var col=COLORS[drag.piece?drag.piece.c:S.color].fill;
      if(drag.piece){
        var v=nearestVertex(p);
        if(v>=0){var vv=M().verts[v],ok=(v===drag.from)||canPlace(v,drag.piece);
          h+='<circle class="target'+(ok?'':' bad')+'" cx="'+vv.x+'" cy="'+vv.y+'" r="34"/>';}
        h+=pieceSvg(drag.piece,p.x,p.y-10,'ghost');
      }
      h+='<circle class="cursor'+(pinched?' grab':'')+'" cx="'+p.x+'" cy="'+p.y+'" r="22" stroke="'+col+'" fill="'+col+'"/>';
    }
    $('overlay').innerHTML=h;
  }

  // 画面タッチ／マウスでも同じ操作ができる（動作確認用・予備）
  svg.addEventListener('pointerdown',function(e){if(e.button&&e.button!==0)return;svg.setPointerCapture(e.pointerId);onGrab(toSvg(e.clientX,e.clientY));wake();});
  svg.addEventListener('pointermove',function(e){onMove(toSvg(e.clientX,e.clientY));});
  svg.addEventListener('pointerup',function(e){onRelease(toSvg(e.clientX,e.clientY));});
  svg.addEventListener('pointercancel',function(){onRelease(null);});

  // ---------- カメラからの入力（正規化座標 0..1 は画面全体に対する位置） ----------
  var lastCam=0,camPinch=false,camTimer=null;
  function fromCam(m){
    lastCam=Date.now();
    if(!m.h){ // 手が見えない
      if(camPinch){camPinch=false;onRelease(null);}
      pointerSvg=null;renderOverlay();return;
    }
    var p=toSvg(m.x*window.innerWidth,m.y*window.innerHeight);
    if(m.g&&!camPinch){camPinch=true;onGrab(p);}
    else if(!m.g&&camPinch){camPinch=false;onRelease(p);}
    else onMove(p);
  }
  setInterval(function(){var on=Date.now()-lastCam<2000;$('cam').classList.toggle('on',on);$('cam').querySelector('span').textContent=on?'カメラ接続中':'カメラ未接続';},500);

  // ---------- 中継サーバー ----------
  var ws=null,retry=null;
  function connect(){
    if(ws){try{ws.onclose=null;ws.close();}catch(e){}ws=null;}
    clearTimeout(retry);
    $('code').textContent=S.code;
    var url=(S.relay||'').replace(/\/+$/,'');
    if(!/^wss?:\/\//.test(url)||/YOUR-SUBDOMAIN/.test(url)){setRelay(false,'中継サーバーが未設定（設定から入力）');return;}
    setRelay(false,'中継サーバーに接続中…');
    try{ws=new WebSocket(url+'/room/'+S.code);}catch(e){setRelay(false,'アドレスが正しくありません');return;}
    ws.onopen=function(){setRelay(true,'中継サーバー接続中');};
    ws.onmessage=function(ev){try{var m=JSON.parse(ev.data);if(m.t==='p')fromCam(m);}catch(e){}};
    ws.onclose=function(){setRelay(false,'中継サーバーから切断（再接続します）');retry=setTimeout(connect,3000);};
    ws.onerror=function(){};
  }
  function setRelay(on,text){$('relay').classList.toggle('on',on);$('relay').querySelector('span').textContent=text;}

  // ---------- ボタン ----------
  function setBoard(b){S.board=b;S.pieces=[];save();renderBoard();}
  $('b-new').onclick=function(){setBoard(generate(S.board.mode));};
  $('b-mode').onclick=function(){setBoard(generate(S.board.mode==='std'?'six':'std'));};
  $('b-last').onclick=function(){var b=lastGenerated();if(b)setBoard(b);else flash('この端末には盤面メーカーで作った盤面がありません');};
  $('b-clear').onclick=function(){S.pieces=[];save();renderPieces();};
  $('b-marks').onclick=function(){S.showMarks=!S.showMarks;save();applyMarks();};
  $('b-full').onclick=function(){var el=document.documentElement;try{var p=el.requestFullscreen&&el.requestFullscreen();if(p&&p.catch)p.catch(function(){});}catch(e){}};
  $('b-set').onclick=function(){$('in-relay').value=S.relay;$('in-code').value=S.code;$('dlg').showModal();};
  $('dlg-cancel').onclick=function(){$('dlg').close();};
  $('dlg-ok').onclick=function(){
    var c=$('in-code').value.toUpperCase().replace(/[^A-Z0-9]/g,'');
    if(c.length<4){flash('ルームコードは4文字以上にしてください');return;}
    S.relay=$('in-relay').value.trim();S.code=c;save();$('dlg').close();connect();
  };
  function applyMarks(){document.body.classList.toggle('nomarks',!S.showMarks);$('b-marks').textContent=S.showMarks?'目印を隠す':'目印を出す';}
  var idleT=null;function wake(){document.body.classList.remove('idle');clearTimeout(idleT);idleT=setTimeout(function(){document.body.classList.add('idle');},4000);}
  ['mousemove','pointerdown','touchstart','keydown'].forEach(function(ev){document.addEventListener(ev,wake,{passive:true});});
  try{if(navigator.wakeLock)navigator.wakeLock.request('screen').catch(function(){});}catch(e){}

  load();applyMarks();renderBoard();connect();wake();
})();
</script>
</body>
</html>
