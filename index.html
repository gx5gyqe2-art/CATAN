<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>カタン盤面メーカー</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bitter:wght@800&family=Dela+Gothic+One&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap">
<style>
/* Layout: the sea is the page. A narrow control rail sits on the left; the island fills everything else and takes the whole screen in projection mode. */
:root{
  color-scheme:dark;
  --sea:#0a2030; --sea-2:#123a52; --panel:#0e2a3e; --line:#27495e;
  --ink:#ecf3f1; --muted:#9fb7c1;
  --accent:#f4b63f; --accent-ink:#2a1c05;
  --shore:#ead9ae; --pier:#b08a55;
  --token:#f7edd3; --token-ink:#2b2219; --token-hot:#c5301c; --robber:#4a4038;
  --t-forest:#2f7f50; --t-forest-2:#1f6039;
  --t-hills:#c4622f; --t-hills-2:#9a4519;
  --t-pasture:#9ed05a; --t-pasture-2:#7db23d;
  --t-fields:#f1c644; --t-fields-2:#d8a41f;
  --t-mountains:#8d97a8; --t-mountains-2:#6a7487;
  --t-desert:#e6d3a0; --t-desert-2:#cdb777;
  --font-display:"Dela Gothic One","Hiragino Kaku Gothic ProN","Yu Gothic",Meiryo,sans-serif;
  --font-body:"Zen Kaku Gothic New","Hiragino Kaku Gothic ProN","Yu Gothic",Meiryo,sans-serif;
  --font-num:"Bitter",Georgia,"Times New Roman",serif;
}
@media (prefers-color-scheme: light){
  :root:not([data-theme="dark"]){
    color-scheme:light;
    --sea:#bfdde8; --sea-2:#e2f1f6; --panel:#f3f8fa; --line:#b3ccd6;
    --ink:#12303f; --muted:#4b6876;
    --accent:#f4b63f; --accent-ink:#2a1c05;
    --shore:#f4e8c6; --pier:#8f6b3a;
  }
}
:root[data-theme="light"]{
  color-scheme:light;
  --sea:#bfdde8; --sea-2:#e2f1f6; --panel:#f3f8fa; --line:#b3ccd6;
  --ink:#12303f; --muted:#4b6876;
  --accent:#f4b63f; --accent-ink:#2a1c05;
  --shore:#f4e8c6; --pier:#8f6b3a;
}

*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0;background:var(--sea);color:var(--ink);
  font-family:var(--font-body);font-size:15px;line-height:1.6;
  display:grid;grid-template-columns:minmax(264px,320px) minmax(0,1fr);grid-template-rows:minmax(0,1fr);
}

/* ---------- control rail ---------- */
.rail{
  background:var(--panel);border-right:1px solid var(--line);
  padding-block:22px;padding-inline:16px;
  overflow-y:auto;display:flex;flex-direction:column;gap:22px;min-width:0;
}
h1{font-family:var(--font-display);font-weight:400;font-size:24px;line-height:1.25;margin:0;text-wrap:balance}
.lede{margin:6px 0 0;color:var(--muted);font-size:13.5px}
h2{font-size:12px;font-weight:700;letter-spacing:.12em;color:var(--muted);margin:0 0 10px}
.actions{display:flex;flex-direction:column;gap:8px}
.btn{
  font:inherit;font-weight:700;color:var(--ink);background:transparent;
  border:1.5px solid var(--line);border-radius:8px;padding:10px 12px;
  display:flex;align-items:center;justify-content:space-between;gap:10px;cursor:pointer;text-align:left;
}
.btn:hover{border-color:var(--ink)}
.btn:disabled{opacity:.4;cursor:default;border-color:var(--line)}
.btn:focus-visible,input:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
.btn-primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-size:17px;padding:14px 14px}
.btn-primary:hover{border-color:var(--accent-ink)}
kbd{
  font:700 11px/1 var(--font-body);letter-spacing:.04em;
  border:1px solid currentColor;border-radius:4px;padding:3px 6px;opacity:.7;white-space:nowrap;
}
.seg{display:grid;grid-template-columns:1fr 1fr;border:1.5px solid var(--line);border-radius:8px;padding:3px;gap:3px}
.seg label{position:relative;cursor:pointer}
.seg input{position:absolute;opacity:0;inset:0;margin:0;cursor:pointer}
.seg span{display:block;text-align:center;font-weight:700;padding:7px 4px;border-radius:5px;color:var(--muted)}
.seg input:checked+span{background:var(--ink);color:var(--panel)}
.seg input:focus-visible+span{outline:3px solid var(--accent);outline-offset:1px}
.rules{display:flex;flex-direction:column;gap:9px}
.rules label{display:flex;gap:10px;align-items:flex-start;cursor:pointer}
.rules input{accent-color:var(--accent);width:17px;height:17px;margin:3px 0 0;flex:none}
.note{color:var(--muted);font-size:12.5px;margin:10px 0 0}

.yield{display:grid;grid-template-columns:auto auto minmax(0,1fr) auto;gap:8px 10px;align-items:center;margin:0;padding:0;list-style:none}
.yield li{display:contents}
.sw{width:18px;height:20px;clip-path:polygon(50% 0,100% 25%,100% 75%,50% 100%,0 75%,0 25%)}
.yield .res{font-weight:700}
.yield .bar{height:6px;border-radius:3px;background:var(--line);overflow:hidden}
.yield .bar i{display:block;height:100%;background:var(--ink)}
.yield .val{font-variant-numeric:tabular-nums;font-weight:700;text-align:right;min-width:2ch}

/* ---------- the board ---------- */
.stage{
  position:relative;min-width:0;min-height:0;padding-block:12px;padding-inline:16px;
  background:radial-gradient(closest-side,var(--sea-2),var(--sea));
}
.stage svg{position:absolute;top:12px;left:16px;width:calc(100% - 32px);height:calc(100% - 24px);display:block}
[hidden]{display:none!important}
.hex{stroke:var(--shore);stroke-width:7;stroke-linejoin:round}
.hex.photo{fill:none;stroke:var(--sea);stroke-width:6}
.lbl{font-family:var(--font-display);font-size:30px;text-anchor:middle;dominant-baseline:central;
  fill:var(--token-ink);stroke:var(--token);stroke-width:7;stroke-linejoin:round;paint-order:stroke}
.tok circle{fill:var(--token-ink)}
.tok .disc{fill:var(--token);stroke:var(--token-ink);stroke-opacity:.3;stroke-width:2}
.num{font-family:var(--font-num);font-weight:800;font-size:42px;text-anchor:middle;dominant-baseline:central;fill:var(--token-ink)}
.hot .num{fill:var(--token-hot)}
.hot circle{fill:var(--token-hot)}
.tok.hot .disc{fill:var(--token)}
.robber{fill:var(--robber);stroke:var(--token);stroke-width:2.5}
.pier{stroke:var(--pier);stroke-width:8;stroke-linecap:round}
.port .ring{fill:var(--token);stroke-width:9}
.port .pk{font-family:var(--font-display);font-size:25px;text-anchor:middle;dominant-baseline:central;fill:var(--token-ink)}
.port .pr{font-family:var(--font-num);font-weight:800;font-size:18px;text-anchor:middle;dominant-baseline:central;fill:var(--token-ink)}
.port .pr.big{font-size:26px}
.b-forest,.sw-forest{fill:var(--t-forest);background:var(--t-forest)}   .k-forest{fill:var(--t-forest-2)}
.b-hills,.sw-hills{fill:var(--t-hills);background:var(--t-hills)}       .k-hills{stroke:var(--t-hills-2);stroke-width:2;fill:none}
.b-pasture,.sw-pasture{fill:var(--t-pasture);background:var(--t-pasture)} .k-pasture{fill:var(--t-pasture-2)}
.b-fields,.sw-fields{fill:var(--t-fields);background:var(--t-fields)}   .k-fields{stroke:var(--t-fields-2);stroke-width:3;fill:none}
.b-mountains,.sw-mountains{fill:var(--t-mountains);background:var(--t-mountains)} .k-mountains{stroke:var(--t-mountains-2);stroke-width:2.5;fill:none}
.b-desert{fill:var(--t-desert)} .k-desert{fill:var(--t-desert-2)}
.r-any{stroke:var(--pier)} .r-forest{stroke:var(--t-forest)} .r-hills{stroke:var(--t-hills)}
.r-pasture{stroke:var(--t-pasture-2)} .r-fields{stroke:var(--t-fields-2)} .r-mountains{stroke:var(--t-mountains)}

@media (prefers-reduced-motion:no-preference){
  .fresh .deal{animation:deal .34s cubic-bezier(.2,.9,.3,1.25) backwards;animation-delay:calc(var(--i)*20ms);
    transform-box:fill-box;transform-origin:center}
}
@keyframes deal{from{opacity:0;transform:scale(.55)}}

/* ---------- projection mode ---------- */
.projbar{
  position:fixed;left:0;right:0;bottom:0;display:flex;justify-content:center;gap:8px;flex-wrap:wrap;
  padding:10px 16px calc(10px + env(safe-area-inset-bottom,0px));transition:opacity .3s;
}
.projbar .btn{background:var(--panel);font-size:13px;padding:7px 10px}
body.projecting{grid-template-columns:minmax(0,1fr)}
body.projecting .rail{display:none}
body.projecting .stage svg{top:6px;left:8px;width:calc(100% - 16px);height:calc(100% - 12px)}
body.projecting.idle{cursor:none}
body.projecting.idle .projbar{opacity:0}
body.projecting.idle .projbar:focus-within{opacity:1}

@media (max-width:760px){
  html,body{height:auto}
  body{grid-template-columns:minmax(0,1fr);grid-template-rows:auto}
  .stage{order:-1;width:100%;aspect-ratio:1090/970;max-width:100%}
  .rail{border-right:0;border-top:1px solid var(--line);overflow:visible}
  body.projecting,html:has(body.projecting){height:100%}
  body.projecting{grid-template-rows:minmax(0,1fr)}
  body.projecting .stage{aspect-ratio:auto}
}
</style>

</head>
<body>
<aside class="rail" id="rail">
  <header>
    <h1>カタン盤面メーカー</h1>
    <p class="lede" id="lede">標準セットの地形19枚・数字チップ18枚・港9つをランダムに並べます。</p>
  </header>

  <div class="seg" role="radiogroup" aria-label="人数">
    <label><input type="radio" name="mode" id="mode-std" value="std" checked><span>3〜4人</span></label>
    <label><input type="radio" name="mode" id="mode-six" value="six"><span>5〜6人</span></label>
  </div>

  <div class="actions">
    <button class="btn btn-primary" id="btn-new" type="button">新しい盤面を作る <kbd>Space</kbd></button>
    <button class="btn" id="btn-back" type="button">ひとつ前に戻す <kbd>Z</kbd></button>
    <button class="btn" id="btn-proj" type="button">投影モード（全画面） <kbd>F</kbd></button>
  </div>

  <section>
    <h2>並べ方のルール</h2>
    <div class="rules">
      <label><input type="checkbox" id="opt-hot" checked><span>6と8を隣り合わせない</span></label>
      <label><input type="checkbox" id="opt-same"><span>同じ数字を隣り合わせない</span></label>
      <label><input type="checkbox" id="opt-terr"><span>同じ地形を隣り合わせない</span></label>
      <label><input type="checkbox" id="opt-ports" checked><span>港も表示する</span></label>
      <label><input type="checkbox" id="opt-photo" checked><span>タイルを実物の写真で表示</span></label>
    </div>
    <p class="note">写真は、いただいたタイル写真6枚から切り抜いたものです。人数は <kbd>M</kbd> キーでも切り替えられます。上の3つは、次に作る盤面から反映されます。港は位置を固定し、種類だけを入れ替えています。</p>
  </section>

  <section>
    <h2>この盤面の産出力</h2>
    <ul class="yield" id="yield"></ul>
    <p class="note">サイコロ36回あたりに、その資源のタイルが当たる回数の目安です。</p>
  </section>
</aside>

      label:'5〜6人用拡張の地形30枚・数字チップ28枚・港11をランダムに並べます。',
      rows:[3,4,5,6,5,4,3],
      terrain:{forest:6,hills:5,pasture:6,fields:6,mountains:5,desert:2},
      nums:{2:2,3:3,4:3,5:3,6:3,8:3,9:3,10:3,11:3,12:2},
      ports:{any:5,forest:1,hills:1,pasture:2,fields:1,mountains:1},
      slots:null,
      scale:30
    }
  };

  // ---------- geometry ----------
  Object.keys(MODES).forEach(function(m){
    var M=MODES[m], nr=M.rows.length, hexes=[], at={};
    M.rows.forEach(function(L,ri){
      for(var p=0;p<L;p++){at[ri+','+p]=hexes.length;hexes.push({x:W*(p-(L-1)/2),y:1.5*R*(ri-(nr-1)/2)});}
    });
    function find(x,y){for(var i=0;i<hexes.length;i++)if(Math.abs(hexes[i].x-x)<1&&Math.abs(hexes[i].y-y)<1)return i;return -1;}
    var nbr=hexes.map(function(){return [];}), outer=[];
    hexes.forEach(function(h,i){
      for(var k=0;k<6;k++){
        var a=k*Math.PI/3, j=find(h.x+W*Math.cos(a),h.y+W*Math.sin(a));
        if(j>=0)nbr[i].push(j);
        else outer.push({i:i,k:k,ang:Math.atan2(h.y+0.87*R*Math.sin(a),h.x+0.87*R*Math.cos(a))});
      }
    });
    M.hexes=hexes;M.nbr=nbr;M.n=hexes.length;
    if(M.slots){
      M.portAt=M.slots.map(function(s){return [at[s[0]+','+s[1]],s[2]];});
    }else{
      // spread the ports evenly around the coastline
      outer.sort(function(a,b){return a.ang-b.ang;});
      var np=expand(M.ports).length, E=outer.length;
      M.portAt=[];
      for(var q=0;q<np;q++){var e=outer[Math.floor(q*E/np+1)%E];M.portAt.push([e.i,e.k]);}
    }
  });

  var HEXPTS=[0,1,2,3,4,5].map(function(k){
    var a=(60*k-90)*Math.PI/180;return (R*Math.cos(a)).toFixed(1)+','+(R*Math.sin(a)).toFixed(1);
  }).join(' ');

  function shuffle(a){
    for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t;}
    return a;
  }
  function pipsOf(n){return 6-Math.abs(7-n);}

  // Randomised backtracking: fills the slots with the bag so that no two neighbours conflict.
  function place(M,slots,bag,conflict){
    var out={}, budget=300000;
    var inSlots={};slots.forEach(function(s){inSlots[s]=1;});
    function go(d,rest){
      if(d===slots.length)return true;
      if(--budget<0)return false;
      var s=slots[d], seen={}, order=shuffle(rest.slice());
      for(var x=0;x<order.length;x++){
        var v=order[x];if(seen[v])continue;seen[v]=1;
        var bad=M.nbr[s].some(function(j){return out[j]!==undefined&&conflict(v,out[j]);});
        if(bad)continue;
        out[s]=v;
        var r2=rest.slice();r2.splice(r2.indexOf(v),1);
        if(go(d+1,r2))return true;
        delete out[s];
      }
      return false;
    }
    if(!go(0,bag)){out={};var b=shuffle(bag.slice());slots.forEach(function(s,i){out[s]=b[i];});}
    return out;
  }

  function generate(mode,o){
    var M=MODES[mode], all=[];
    for(var i=0;i<M.n;i++)all.push(i);
    var tt=place(M,all,expand(M.terrain),function(a,b){return o.terr&&a===b;});
    var terrain=all.map(function(i){return tt[i];});
    var land=all.filter(function(i){return terrain[i]!=='desert';});
    var nn=place(M,land,expand(M.nums),function(a,b){
      if(o.hot&&(a===6||a===8)&&(b===6||b===8))return true;
      if(o.same&&a===b)return true;
      return false;
    });
    var numbers=all.map(function(i){return nn[i]||0;});
    return {mode:mode,terrain:terrain,numbers:numbers,ports:shuffle(expand(M.ports))};
  }

  // ---------- state ----------
  var $=function(id){return document.getElementById(id);};
  var optIds={hot:'opt-hot',same:'opt-same',terr:'opt-terr',ports:'opt-ports',photo:'opt-photo'};
  var stack=[];
  function currentMode(){var r=document.querySelector('input[name="mode"]:checked');return r?r.value:'std';}
  function setMode(m){var r=document.querySelector('input[name="mode"][value="'+m+'"]');if(r)r.checked=true;}
  function readOpts(){var o={};Object.keys(optIds).forEach(function(k){o[k]=$(optIds[k]).checked;});return o;}
  function save(){
    try{localStorage.setItem(KEY,JSON.stringify({stack:stack.slice(-20),opts:readOpts(),mode:currentMode()}));}catch(e){}
  }
  function validBoard(b){
    var M=b&&MODES[b.mode];
    return M&&Array.isArray(b.terrain)&&b.terrain.length===M.n&&Array.isArray(b.numbers)&&b.numbers.length===M.n&&
      Array.isArray(b.ports)&&b.ports.length===M.portAt.length&&b.terrain.every(function(k){return T[k];});
  }
  function load(){
    try{
      var d=JSON.parse(localStorage.getItem(KEY)||'null');
      if(!d)return;
      if(d.opts)Object.keys(optIds).forEach(function(k){if(typeof d.opts[k]==='boolean')$(optIds[k]).checked=d.opts[k];});
      if(d.mode&&MODES[d.mode])setMode(d.mode);
      if(Array.isArray(d.stack))stack=d.stack.filter(validBoard);
    }catch(e){}
  }

  // ---------- drawing ----------
  var svg=$('board');
  function render(fresh){
    var b=stack[stack.length-1], M=MODES[b.mode], showPorts=$(optIds.ports).checked, photo=$(optIds.photo).checked, html='', robber=false;
    setMode(b.mode);$('lede').textContent=M.label;
    M.hexes.forEach(function(h,i){
      var k=b.terrain[i], n=b.numbers[i];
      var inner=photo
        ?'<g clip-path="url(#hexclip)"><use href="#ph-'+k+'" transform="rotate('+(((i*5+k.length)%6)*60)+')"/></g><polygon class="hex photo" points="'+HEXPTS+'"/>'
        :'<polygon class="hex" points="'+HEXPTS+'" fill="url(#p-'+k+')"/>';
      if(k==='desert'){
        if(!photo)inner+='<text class="lbl" y="'+(robber?-6:-46)+'">砂漠</text>';
        if(!robber){inner+='<g class="robber"><circle cy="0" r="11"/><path d="M-17 44q0-34 17-34 17 0 17 34z"/></g>';robber=true;}
      }else{
        var p=pipsOf(n), dots='';
        for(var j=0;j<p;j++)dots+='<circle cx="'+((j-(p-1)/2)*9)+'" cy="37" r="3.1"/>';
        inner+=(photo?'':'<text class="lbl" y="-52">'+T[k].short+'</text>')+'<g class="tok'+(p===5?' hot':'')+'"><circle class="disc" cy="14" r="38"/><text class="num" y="7">'+n+'</text>'+dots+'</g>';
      }
      html+='<g transform="translate('+h.x.toFixed(1)+' '+h.y.toFixed(1)+')"><g class="deal" style="--i:'+i+'">'+inner+'</g></g>';
    });
    $('tiles').innerHTML=html;

    var ph='';
    if(showPorts)M.portAt.forEach(function(s,i){
      var h=M.hexes[s[0]], a=s[1]*60*Math.PI/180, k=b.ports[i];
      var cx=h.x+152*Math.cos(a), cy=h.y+152*Math.sin(a);
      [-1,1].forEach(function(sg){
        var va=a+sg*Math.PI/6;
        ph+='<line class="pier" x1="'+cx.toFixed(1)+'" y1="'+cy.toFixed(1)+'" x2="'+(h.x+R*Math.cos(va)).toFixed(1)+'" y2="'+(h.y+R*Math.sin(va)).toFixed(1)+'"/>';
      });
      ph+='<g class="port" transform="translate('+cx.toFixed(1)+' '+cy.toFixed(1)+')"><circle class="ring r-'+k+'" r="36"/>'+
        (k==='any'?'<text class="pr big" y="1">3:1</text>':'<text class="pk" y="-8">'+T[k].short+'</text><text class="pr" y="17">2:1</text>')+'</g>';
    });
    $('ports').innerHTML=ph;

    var pad=showPorts?200:112, x0=1e9,x1=-1e9,y0=1e9,y1=-1e9;
    M.hexes.forEach(function(h){x0=Math.min(x0,h.x);x1=Math.max(x1,h.x);y0=Math.min(y0,h.y);y1=Math.max(y1,h.y);});
    svg.setAttribute('viewBox',(x0-pad)+' '+(y0-pad)+' '+(x1-x0+2*pad)+' '+(y1-y0+2*pad));
    svg.classList.toggle('fresh',!!fresh);

    var prod={};
    b.terrain.forEach(function(k,i){if(b.numbers[i])prod[k]=(prod[k]||0)+pipsOf(b.numbers[i]);});
    $('yield').innerHTML=['forest','hills','pasture','fields','mountains'].map(function(k){
      var v=prod[k]||0;
      return '<li><span class="sw sw-'+k+'"></span><span class="res">'+T[k].res+'</span>'+
        '<span class="bar"><i style="width:'+Math.min(100,v/M.scale*100)+'%"></i></span><span class="val">'+v+'</span></li>';
    }).join('');

    var one=stack.length<2;
    $('btn-back').disabled=one;$('pb-back').disabled=one;
    $('pb-mode').textContent=b.mode==='std'?'5〜6人用に切替':'3〜4人用に切替';
  }

  function newBoard(){stack.push(generate(currentMode(),readOpts()));if(stack.length>20)stack.shift();save();render(true);}
  function back(){if(stack.length>1){stack.pop();save();render(false);}}
  function toggleMode(){setMode(currentMode()==='std'?'six':'std');newBoard();}

  // ---------- projection mode ----------
  var body=document.body, lock=null, idleTimer=null, wasFull=false;
  function wake(){
    body.classList.remove('idle');clearTimeout(idleTimer);
    if(body.classList.contains('projecting'))idleTimer=setTimeout(function(){body.classList.add('idle');},2500);
  }
  function enterProj(){
    body.classList.add('projecting');$('projbar').hidden=false;wake();
    var el=document.documentElement;
    try{var p=el.requestFullscreen&&el.requestFullscreen();if(p&&p.catch)p.catch(function(){});}catch(e){}
    try{
      if(navigator.wakeLock)navigator.wakeLock.request('screen').then(function(l){lock=l;}).catch(function(){});
    }catch(e){}
  }
  function exitProj(){
    body.classList.remove('projecting','idle');$('projbar').hidden=true;clearTimeout(idleTimer);
    try{if(document.fullscreenElement)document.exitFullscreen().catch(function(){});}catch(e){}
    try{if(lock){lock.release();lock=null;}}catch(e){}
    wasFull=false;
  }
  document.addEventListener('fullscreenchange',function(){
    if(document.fullscreenElement)wasFull=true;
    else if(wasFull)exitProj();
  });
  ['mousemove','mousedown','touchstart'].forEach(function(ev){document.addEventListener(ev,wake,{passive:true});});

  // ---------- wiring ----------
  $('btn-new').addEventListener('click',newBoard);$('pb-new').addEventListener('click',newBoard);
  $('btn-back').addEventListener('click',back);$('pb-back').addEventListener('click',back);
  $('btn-proj').addEventListener('click',enterProj);$('pb-exit').addEventListener('click',exitProj);
  $('pb-mode').addEventListener('click',toggleMode);
  Array.prototype.forEach.call(document.querySelectorAll('input[name="mode"]'),function(r){r.addEventListener('change',newBoard);});
  Object.keys(optIds).forEach(function(k){
    $(optIds[k]).addEventListener('change',function(){save();if(k==='ports'||k==='photo')render(false);});
  });
  document.addEventListener('keydown',function(e){
    if(e.ctrlKey||e.metaKey||e.altKey)return;
    var tag=(e.target&&e.target.tagName)||'';
    var onControl=tag==='BUTTON'||tag==='INPUT';
    if(e.key===' '||e.code==='Space'){if(onControl)return;e.preventDefault();newBoard();wake();}
    else if(e.key==='z'||e.key==='Z'){back();wake();}
    else if(e.key==='m'||e.key==='M'){toggleMode();wake();}
    else if(e.key==='f'||e.key==='F'){if(body.classList.contains('projecting'))exitProj();else enterProj();}
    else if(e.key==='Escape'&&body.classList.contains('projecting'))exitProj();
  });

  load();
  if(stack.length){render(false);}else{newBoard();}
})();
</script>

</body>
</html>
